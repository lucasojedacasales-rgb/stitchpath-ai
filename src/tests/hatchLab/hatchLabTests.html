<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hatch Lab — Test Runner (P0.1)</title>
  <style>
    body { font-family: ui-monospace, monospace; margin: 0; padding: 24px; color: #111; }
    .pass-bg { background: #16a34a; color: #fff; }
    .fail-bg { background: #dc2626; color: #fff; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .suite { background: rgba(255,255,255,0.92); color: #111; border-radius: 8px; padding: 12px 16px; margin: 10px 0; }
    .suite.fail { border-left: 6px solid #7f1d1d; }
    .suite.ok { border-left: 6px solid #14532d; }
    .failitem { color: #b91c1c; margin: 2px 0 2px 16px; }
    pre { background: rgba(0,0,0,0.75); color: #d1fae5; padding: 12px; border-radius: 8px; overflow: auto; max-height: 45vh; font-size: 11px; }
    #summary { font-size: 16px; font-weight: bold; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Hatch Lab — ejecución real de pruebas (P0.1)</h1>
  <div id="summary">Ejecutando…</div>
  <div id="suites"></div>
  <h2 style="font-size:14px">Resultado JSON completo</h2>
  <pre id="json"></pre>
  <script type="module">
    import { runHatchLabTests } from '/src/tests/hatchLab/runHatchLabTests.js';
    const out = runHatchLabTests();
    const allPass = out.summary.fail === 0;
    document.body.classList.add(allPass ? 'pass-bg' : 'fail-bg');
    document.getElementById('summary').textContent =
      `TOTAL: ${out.summary.total} suites · PASS: ${out.summary.pass} · FAIL: ${out.summary.fail} · checks: ${out.summary.checks} · ${allPass ? 'TODO CORRECTO ✔' : 'HAY FALLOS ✘'}`;
    document.getElementById('summary').id = allPass ? 'summary-pass' : 'summary-fail';
    const suitesEl = document.getElementById('suites');
    for (const s of out.suites) {
      const div = document.createElement('div');
      div.className = 'suite ' + (s.pass ? 'ok' : 'fail');
      div.innerHTML = `<strong>${s.name}</strong> — ${s.pass ? 'PASS' : 'FAIL'} (${s.checks} checks)` +
        (s.fails || []).map(f => `<div class="failitem">✘ ${f.replace(/</g, '&lt;')}</div>`).join('');
      suitesEl.appendChild(div);
    }
    document.getElementById('json').textContent = JSON.stringify(out, null, 2);
    console.log('[hatchLabTests]', JSON.stringify(out.summary), out);
  </script>
</body>
</html>
